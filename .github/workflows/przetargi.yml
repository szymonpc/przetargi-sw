name: Codzienny przegląd przetargów

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  przeglad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Przegląd przetargów
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python przetargi.py
      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "przetargi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wyniki/
          git diff --cached --quiet || git commit -m "Przetargi $(date +%F)"
          git push
